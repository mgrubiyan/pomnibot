- id: UpdateCard
  name: Update a card
  method: PUT
  path: /cards/{cardId}
  role: user
  request:
    path:
      cardId: sample-id
    headers:
      Content-Type: application/json
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - factId
    - factName
    - id
    - kind
    - question
    - setId
    bodySchema:
      type: object
      description: answer, explanation, explanationSvg and sourceQuote are absent
        in a set member's list of the set's cards. New generated cards use GFM + math
        in question, string answers, explanation, choice options and sorting content.
        Inline LaTeX uses $...$ and display LaTeX uses $$...$$; backslashes are escaped
        in JSON. Content is stored as source text, without HTML conversion. Existing
        cards retain their text. factName is plain text; sourceQuote is verbatim and
        never reformatted.
      required:
      - id
      - setId
      - factId
      - factName
      - kind
      - question
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        factId:
          type: string
          format: uuid
        factName:
          type: string
        kind:
          type: string
          enum:
          - choice
          - flip
          - input
          - boolean
          - table
        question:
          type: string
          description: GFM + math; inline LaTeX $...$ and display LaTeX $$...$$.
        options:
          type: array
          items:
            type: string
          description: Choice options as GFM + math.
        table:
          type: object
          description: 'Sorting card: lay terms out across categories. Category names
            and items support GFM + math, including Markdown tables. This task type
            is independent of Markdown table formatting.'
          required:
          - columns
          - items
          properties:
            columns:
              type: array
              items:
                type: string
            items:
              type: array
              items:
                type: object
                description: A sorting item and its category. Both strings support
                  GFM + math.
                required:
                - text
                - column
                properties:
                  text:
                    type: string
                  column:
                    type: string
        answer:
          description: ' choice - GFM + math string[] (all correct option texts);
            legacy string/integer supported input/flip - GFM + math string ($...$
            inline LaTeX, $$...$$ display LaTeX) boolean - boolean table - #/components/schemas/TableLayout '
          oneOf:
          - type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
          - type: integer
          - type: string
          - type: boolean
          - type: object
            description: 'Sorting card: lay terms out across categories. Category
              names and items support GFM + math, including Markdown tables. This
              task type is independent of Markdown table formatting.'
            required:
            - columns
            - items
            properties:
              columns:
                type: array
                items:
                  type: string
              items:
                type: array
                items:
                  type: object
                  description: A sorting item and its category. Both strings support
                    GFM + math.
                  required:
                  - text
                  - column
                  properties:
                    text:
                      type: string
                    column:
                      type: string
        explanation:
          type: string
          description: Explanation as GFM + math, including Markdown tables and LaTeX
            formulas.
        questionSvg:
          type: string
          description: Optional raw static self-contained SVG for the question with
            viewBox, at most 128 KiB. Omitted when absent. Does not reveal the answer.
        explanationSvg:
          type: string
          description: Optional raw static self-contained SVG for the explanation
            with viewBox, at most 128 KiB. Omitted when absent.
        sourceQuote:
          type: string
          description: Verbatim quote from the notes; preserve all original characters
            without Markdown or LaTeX conversion.
        sourceRef:
          type: string
          description: 'where the quote is from: «Лекция 3, стр. 2»'
        step:
          type: integer
  timeoutMs: 5000
  repeatable: false
- id: AnswerQuestion
  name: Answer a card of the current feed and record the verdict
  method: POST
  path: /cards/{cardId}/answer
  role: user
  request:
    path:
      cardId: sample-id
    headers:
      Content-Type: application/json
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - isCorrect
    - method
    bodySchema:
      type: object
      required:
      - isCorrect
      - method
      properties:
        isCorrect:
          type: boolean
        reason:
          type: string
          description: Why the answer counts or what it lacks, when a model judged
            it
        method:
          type: string
          enum:
          - local
          - model
          - fallback
          description: 'local: graded without a model (a typed answer matched up to
            form and typos, or surely wrong); model: judged by meaning; fallback:
            the model did not answer in time, nothing was recorded, ask again'
        reveal:
          type: object
          description: Absent when the method is fallback
          required:
          - answer
          - explanation
          - sourceQuote
          properties:
            answer:
              description: ' choice - GFM + math string[] (all correct option texts);
                legacy string/integer supported input/flip - GFM + math string ($...$
                inline LaTeX, $$...$$ display LaTeX) boolean - boolean table - #/components/schemas/TableLayout '
              oneOf:
              - type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
              - type: integer
              - type: string
              - type: boolean
              - type: object
                description: 'Sorting card: lay terms out across categories. Category
                  names and items support GFM + math, including Markdown tables. This
                  task type is independent of Markdown table formatting.'
                required:
                - columns
                - items
                properties:
                  columns:
                    type: array
                    items:
                      type: string
                  items:
                    type: array
                    items:
                      type: object
                      description: A sorting item and its category. Both strings support
                        GFM + math.
