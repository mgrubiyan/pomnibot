- id: GetToday
  name: Get today overview data
  method: GET
  path: /
  role: user
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - dueCount
    - estimatedMinutes
    - sets
    - user
    bodySchema:
      type: object
      required:
      - user
      - dueCount
      - estimatedMinutes
      - sets
      properties:
        user:
          type: object
          required:
          - id
          - firstName
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            username:
              type: string
            avatarUrl:
              type: string
              description: The user's photo, when they have one and the viewer may
                see it
            anonymous:
              type: boolean
              description: The member has not let the set author see their name; firstName
                is then empty, and lastName and username are left out.
        dueCount:
          type: integer
        estimatedMinutes:
          type: integer
        nextReviewAt:
          type: string
          format: date-time
          nullable: true
          description: Earliest scheduled review for the user, if any
        sets:
          type: array
          items:
            type: object
            required:
            - id
            - title
            - cardsTotal
            - cardsDue
            - author
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
                description: «Матанализ, лекция 3»
              cardsTotal:
                type: integer
              cardsDue:
                type: integer
                description: how many are due for review
              author:
                type: object
                required:
                - id
                - firstName
                properties:
                  id:
                    type: string
                    format: uuid
                  firstName:
                    type: string
                  lastName:
                    type: string
                  username:
                    type: string
                  avatarUrl:
                    type: string
                    description: The user's photo, when they have one and the viewer
                      may see it
                  anonymous:
                    type: boolean
                    description: The member has not let the set author see their name;
                      firstName is then empty, and lastName and username are left
                      out.
              shareCode:
                type: string
                pattern: \d{6}
                example: '123456'
              warnings:
                type: array
                items:
                  type: string
                description: Processing and recognition remarks, visible only to the
                  set author
              userRank:
                type: integer
                description: User's rank place in the set rating (1-based)
                example: 1
              userPercentile:
                type: integer
                description: User's progress mapped from ELO (0-100%)
                example: 85
        isAdmin:
          type: boolean
          description: The user sees every complaint, at GET /admin/issues
  timeoutMs: 5000
  repeatable: true
- id: GetAdminIssues
  name: Every complaint about cards, for admins
  method: GET
  path: /admin/issues
  role: user
  expected:
    statusCodes:
    - 200
    contentType: application/json
    bodySchema:
      type: array
      items:
        type: object
        required:
        - id
        - reason
        - status
        - kind
        - question
        - explanation
        - sourceQuote
        - reporter
        - createdAt
        properties:
          id:
            type: string
            format: uuid
          reason:
            type: string
            description: What is wrong with a card, in the reader's opinion.
            enum:
            - answer
            - wording
            - not-in-notes
            - other
          status:
            type: string
            description: open until the author answers; fixed when the card was edited
              after the complaint; kept when the author left the card as it is; deleted
              when the card is gone.
            enum:
            - open
            - fixed
            - kept
            - deleted
          setTitle:
            type: string
            description: Absent when the set is deleted
          kind:
            type: string
            enum:
            - choice
            - flip
            - input
            - boolean
            - table
          question:
            type: string
            description: GFM + math; inline LaTeX $...$ and display LaTeX $$...$$.
          answer:
            type: string
            description: The answer as stored with the card; absent for tables
          explanation:
            type: string
          sourceQuote:
            type: string
          comment:
            type: string
            description: What the reader wrote; absent when they only picked a reason
          reporter:
            type: object
            required:
            - id
            - firstName
            properties:
              id:
                type: string
                format: uuid
              firstName:
                type: string
              lastName:
                type: string
              username:
                type: string
              avatarUrl:
                type: string
                description: The user's photo, when they have one and the viewer may
                  see it
              anonymous:
                type: boolean
                description: The member has not let the set author see their name;
                  firstName is then empty, and lastName and username are left out.
          createdAt:
            type: string
            format: date-time
  timeoutMs: 5000
  repeatable: true
