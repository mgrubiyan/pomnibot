openapi: 3.0.3
info:
  title: Pomnibot API
  version: 1.0
  description: OpenAPI specification for Pomnibot
tags:
  - name: Sets
    description: Sets of cards
  - name: Cards
    description: Cards
  - name: Homescreen
    description: Homescreen
  - name: Notes
    description: Card sets made from notes

servers:
  - url: /api
    description: Base API prefix

paths:
  /profile:
    get:
      summary: Read the saved profile and verified platform
      operationId: GetProfile
      responses:
        '200':
          description: Saved profile (platform omitted for browser test user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Complete or edit a verified Telegram profile and clear bot dialogue
      operationId: PutProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile/consent:
    put:
      summary: Give or withdraw consent to show set authors the user's name and photo
      description: >-
        Without consent the leaderboard and the mistakes of a set show the
        member to its author as an anonymous participant.
      operationId: PutProfileConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile/avatar:
    put:
      summary: Replace the user's photo
      description: >-
        The image is re-encoded as JPEG, which drops its metadata. Set authors
        see it only when the user agreed to show them their name.
      operationId: PutProfileAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarRequest'
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove the user's photo
      operationId: DeleteProfileAvatar
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /avatars/{avatarId}:
    get:
      summary: A user's photo
      description: >-
        Needs no authorization, since an image tag sends none: the random ID
        reaches only those the photo is shown to, and a new photo gets a new ID.
      operationId: GetAvatar
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: JPEG image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      summary: Health check endpoint
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets:
    post:
      tags: [Sets]
      summary: CreateSet
      operationId: CreateSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}:
    get:
      tags:
        - Sets
      summary: Get a card set
      operationId: GetSet
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Card set retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Sets
      summary: Delete a card set
      operationId: DeleteSet
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set to delete
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card set deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Sets
      summary: Update set title
      operationId: UpdateSet
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSetRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card set updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/facts:
    post:
      tags:
        - Facts
      summary: Create a fact in a set
      operationId: CreateFact
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFactRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Fact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Facts
      summary: Get facts of a set
      operationId: GetFactsBySetID
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Facts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fact'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facts/{factId}:
    patch:
      tags:
        - Facts
      summary: Update fact name
      operationId: UpdateFact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Fact updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Facts
      summary: Delete a fact
      operationId: DeleteFact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Fact deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facts/{factId}/cards:
    post:
      tags:
        - Cards
      summary: Create a card in a fact
      operationId: CreateCardInFact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Card created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facts/{factId}/cards/order:
    put:
      tags:
        - Facts
      summary: Reorder cards in a fact
      operationId: ReorderCards
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCardsRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Cards reordered successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/images:
    get:
      tags: [Sets]
      summary: Get extracted PDF image catalog
      operationId: GetSetImages
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image catalog, including unused figures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardImage'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /images/{assetId}:
    get:
      tags: [Cards]
      summary: Get an image with set access authorization
      operationId: GetCardImage
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cropped PDF figure
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/cards:
    post:
      tags: [Cards]
      summary: CreateCard
      operationId: CreateCard
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Sets
      summary: Get cards
      description: >-
        Only the author can get cards of a set; other users receive 403 Forbidden.
      operationId: GetCardsBySetID
      parameters:
        - name: setId
          in: path
          required: true
          description: Filter cards by set ID
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Cards retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/share:
    get:
      tags:
        - Sets
      summary: Get share code for a set
      operationId: GetSetShareCode
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Set share details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/retention:
    get:
      tags: [Sets]
      summary: Forecast fact recall without changing review state
      operationId: GetSetRetention
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recall probabilities and successful on-time review simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRetention'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/plan:
    get:
      tags:
        - Sets
      summary: Get set's facts plan
      operationId: GetSetPlan
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Pairs fact - date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPlanResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/leaderboard:
    get:
      tags:
        - Sets
      summary: Get set leaderboard for author
      operationId: GetSetLeaderboard
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLeaderboardResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/mistakes:
    get:
      tags:
        - Sets
      summary: Mistakes the members of the author's set make, by fact
      description: >-
        Counts every answer of the current members to the cards of each fact.
        The author's own answers and those of members who left are not counted.
      operationId: GetSetMistakes
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mistakes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetMistakesResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/join:
    post:
      tags:
        - Sets
      summary: Join a card set by code
      operationId: JoinSetByShareCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSetRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Card set joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notes:
    post:
      tags:
        - Notes
      summary: Make a card set from notes
      description: >-
        Takes the files and makes the set in the background, in the same queue
        as the bots' documents; GetNotesJob tells how it goes. Only for a signed
        in account, and one document at a time.
      operationId: UploadNotes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotesUpload'
      responses:
        '202':
          description: The document is in the queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The user's previous document is still being made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The files weigh over 20 MB in all
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Notes
      summary: How the user's latest document goes
      description: >-
        The last document the user sent from the mini app, for an hour after it
        is done. Kept in memory: a restart forgets it, and its set, if made,
        is among the user's sets.
      operationId: GetNotesJob
      responses:
        '200':
          description: The latest document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /:
    get:
      tags:
        - Homescreen
      summary: Get today overview data
      operationId: GetToday
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Today data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayData'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feed:
    get:
      tags:
        - Homescreen
      summary: Get questions of current feed
      description: >-
        Questions only: what answers a card comes back from AnswerQuestion,
        or from RevealCard for a flip card.
      operationId: GetFeedQuestions
      parameters:
        - name: setId
          in: query
          required: false
          description: Filter questions by set, or request set questions for review
          schema:
            type: string
            format: uuid
        - name: early
          in: query
          required: false
          description: When true and setId is provided, includes set cards even if not yet due according to FSRS
          schema:
            type: boolean
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Feed of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedCard'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}:
    put:
      tags:
        - Cards
      summary: Update a card
      operationId: UpdateCard
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Card updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Cards
      summary: Delete a card
      operationId: DeleteCard
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card to delete
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/answer:
    post:
      tags:
        - Cards
      summary: Answer a card of the current feed and record the verdict
      description: >-
        Only the card the feed shows for a due fact is graded and recorded;
        asked again after that, the endpoint repeats the recorded verdict. A
        typed answer need not match word for word: form, word order and typos
        do not matter, and answers in other words are judged by a language
        model. When the model does not answer in time nothing is recorded
        and the method is fallback: ask again. A card the feed does not ask
        and the reader has never answered gets 409.
      operationId: AnswerQuestion
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerQuestionRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerQuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotInFeed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/reveal:
    post:
      tags:
        - Cards
      summary: Show the answer of a flip card before the reader grades themselves
      description: >-
        Flip cards only, and only the card of the current feed or one the
        reader has answered. Recording the grade is AnswerQuestion's job.
      operationId: RevealCard
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardReveal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotInFeed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/issue:
    post:
      tags:
        - Cards
      summary: Report what is wrong with a card
      description: >-
        Saves the complaint with a copy of the card as it was reported, so it
        outlives later edits and the card's deletion.
      operationId: ReportCardIssue
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCardIssueRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card issue reported successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/issues:
    get:
      tags:
        - Cards
      summary: Open complaints about the cards of the author's set
      description: >-
        Grouped by card and reason. A complaint is open until the card is
        edited after it or the author keeps the card as it is.
      operationId: GetSetIssues
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SetIssue'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/issue/resolve:
    post:
      tags:
        - Cards
      summary: Keep a card as it is and close its complaints
      operationId: ResolveCardIssues
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Complaints closed
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/issues:
    get:
      tags:
        - Cards
      summary: Every complaint about cards, for admins
      description: >-
        All complaints across all sets, newest first, each with the copy of
        the card as it was reported and who reported it. Anyone but an admin
        gets an empty list.
      operationId: GetAdminIssues
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCardIssue'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    MiniAppAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: 'max <original MAX initData> or tma <original Telegram initData>. Without it the request uses test user 0; credentials that do not hold or are older than an hour get 401 with code sign_in_expired.'
  responses:
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotInFeed:
      description: The feed does not ask this card now, and the reader has never answered it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden; code profile_required means a Telegram profile must be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Making cards is off here, as on a local server without models
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProfileResponse:
      type: object
      required: [user, profileComplete, dataConsent, dataConsentAnswered]
      properties:
        user:
          $ref: '#/components/schemas/User'
        platform:
          type: string
          enum: [max, telegram]
        profileComplete:
          type: boolean
        dataConsent:
          type: boolean
          description: The user lets set authors see their name and photo
        dataConsentAnswered:
          type: boolean
          description: The user has said yes or no to the consent once; until then the mini-app asks
    ConsentRequest:
      type: object
      required: [given]
      properties:
        given:
          type: boolean
    AvatarRequest:
      type: object
      required: [image]
      properties:
        image:
          description: JPEG or PNG of at most 300 KB and 1024 px a side
          type: string
          format: byte
    ProfileRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    NotesUpload:
      type: object
      required: [files]
      properties:
        files:
          description: >-
            Text, PDF, Word, PowerPoint or photos of the pages, at most 10 files
            and 20 MB in all
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: binary
    NotesJob:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [queued, reading, generating, done, failed]
          description: >-
            queued waits for a turn, reading reads the files, generating makes
            the cards; done and failed are final
        ahead:
          type: integer
          description: Documents ahead in the queue, while queued
        cards:
          type: integer
          description: Cards made so far, while generating
        setId:
          type: string
          format: uuid
          description: The new set, when done
        remarks:
          type: boolean
          description: When done, whether the set has remarks to look at
        reason:
          type: string
          enum: [unreadable, no_text, no_cards, other_text, too_long, too_much, try_later]
          description: >-
            Why the document failed. unreadable comes with a message naming
            what is wrong with the files; too_long means the notes could not be
            taken in whole, too_much that they ran out of the processing limit
        message:
          type: string
          description: For unreadable, what is wrong with the files, for the student
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code, including profile_required and sign_in_expired
        message:
          type: string

    TableItem:
      type: object
      description: A sorting item and its category. Both strings support GFM + math.
      required:
        - text
        - column
      properties:
        text:
          type: string
        column:
          type: string

    TableLayout:
      type: object
      description: "Sorting card: lay terms out across categories. Category names and items support GFM + math, including Markdown tables. This task type is independent of Markdown table formatting."
      required:
        - columns
        - items
      properties:
        columns:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TableItem'

    CardKind:
      type: string
      enum:
        - choice
        - flip
        - input
        - boolean
        - table

    CardAnswer:
      description: "
      choice - GFM + math string[] (all correct option texts); legacy string/integer supported
      input/flip - GFM + math string ($...$ inline LaTeX, $$...$$ display LaTeX)
      boolean - boolean
      table - #/components/schemas/TableLayout
      "
      oneOf:
        - type: array                              # kind choice: all correct option texts
          minItems: 1
          uniqueItems: true
          items:
            type: string
        - type: integer                            # legacy choice: index in options
        - type: string                             # kind input
        - type: boolean                            # kind boolean
        - $ref: '#/components/schemas/TableLayout' # kind table

    CardImage:
      type: object
      required: [assetId, url, alt, width, height, sourcePage, sourceName]
      properties:
        assetId:
          type: string
          format: uuid
        url:
          type: string
        alt:
          type: string
        width:
          type: integer
        height:
          type: integer
        sourcePage:
          type: integer
        sourceName:
          type: string

    Card:
      type: object
      description: >-
        answer, explanation, explanationSvg and sourceQuote are absent in a set member's
        list of the set's cards.
        New generated cards use GFM + math in question, string answers, explanation,
        choice options and sorting content. Inline LaTeX uses $...$ and display
        LaTeX uses $$...$$; backslashes are escaped in JSON. Content is stored as
        source text, without HTML conversion. Existing cards retain their text.
        factName is plain text; sourceQuote is verbatim and never reformatted.
      required:
        - id
        - setId
        - factId
        - factName
        - kind
        - question
        - questionImages
        - explanationImages
      properties:
        questionImages:
          type: array
          items:
            $ref: '#/components/schemas/CardImage'
        explanationImages:
          type: array
          items:
            $ref: '#/components/schemas/CardImage'
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        factId:
          type: string
          format: uuid
        factName:
          type: string
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
          description: GFM + math; inline LaTeX $...$ and display LaTeX $$...$$.
        options:
          type: array
          items:
            type: string
          description: Choice options as GFM + math.
        table:
          $ref: '#/components/schemas/TableLayout'
        answer:
          $ref: '#/components/schemas/CardAnswer'
        explanation:
          type: string
          description: Explanation as GFM + math, including Markdown tables and LaTeX formulas.
        questionSvg:
          type: string
          description: Optional raw static self-contained SVG for the question with viewBox, at most 128 KiB. Omitted when absent. Does not reveal the answer.
        explanationSvg:
          type: string
          description: Optional raw static self-contained SVG for the explanation with viewBox, at most 128 KiB. Omitted when absent.
        sourceQuote:
          type: string
          description: Verbatim quote from the notes; preserve all original characters without Markdown or LaTeX conversion.
        sourceRef:
          type: string
          description: "where the quote is from: «Лекция 3, стр. 2»"
        step:
          type: integer

    Fact:
      type: object
      required:
        - id
        - setId
        - name
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        name:
          type: string

    CreateFactRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    UpdateFactRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    UpdateSetRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string

    ReorderCardsRequest:
      type: object
      required:
        - cardIds
      properties:
        cardIds:
          type: array
          items:
            type: string
            format: uuid

    FeedCard:
      type: object
      description: A card as the feed asks it, with nothing that gives the answer away.
      required:
        - id
        - setId
        - factId
        - factName
        - kind
        - question
        - questionImages
      properties:
        questionImages:
          type: array
          items:
            $ref: '#/components/schemas/CardImage'
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        factId:
          type: string
          format: uuid
        factName:
          type: string
        kind:
          $ref: '#/components/schemas/CardKind'
        questionSvg:
          type: string
          description: Optional raw static self-contained SVG for the question with viewBox, at most 128 KiB. Omitted when absent. Does not reveal the answer.
        question:
          type: string
          description: GFM + math; inline LaTeX $...$ and display LaTeX $$...$$.
        options:
          type: array
          items:
            type: string
          description: Choice options as GFM + math.
        table:
          $ref: '#/components/schemas/FeedTable'

    FeedTable:
      type: object
      description: The columns of a sorting card and the terms to lay out, without their places.
      required:
        - columns
        - items
      properties:
        columns:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            type: string

    CardReveal:
      type: object
      description: What a feed card hides until it is answered.
      required:
        - answer
        - explanation
        - sourceQuote
        - explanationImages
      properties:
        explanationImages:
          type: array
          items:
            $ref: '#/components/schemas/CardImage'
        answer:
          $ref: '#/components/schemas/CardAnswer'
        explanation:
          type: string
          description: Explanation as GFM + math, including Markdown tables and LaTeX formulas.
        explanationSvg:
          type: string
          description: Optional raw static self-contained SVG for the explanation with viewBox, at most 128 KiB. Omitted when absent.
        sourceQuote:
          type: string
        sourceRef:
          type: string

    CreateSetRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        card:
          $ref: '#/components/schemas/CreateCardRequest'

    CreateCardRequest:
      type: object
      required: [kind, question, answer]
      properties:
        questionImageIds:
          type: array
          maxItems: 80
          uniqueItems: true
          description: Ordered image IDs of this set; omitted preserves attachments on update, empty removes them.
          items:
            type: string
            format: uuid
        explanationImageIds:
          type: array
          maxItems: 80
          uniqueItems: true
          description: Ordered image IDs of this set; omitted preserves attachments on update, empty removes them.
          items:
            type: string
            format: uuid
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
          description: GFM + math; inline LaTeX $...$ and display LaTeX $$...$$.
        answer:
          $ref: '#/components/schemas/CardAnswer'
        options:
          type: array
          items:
            type: string
        table:
          $ref: '#/components/schemas/TableLayout'
        explanation:
          type: string

    UpdateCardRequest:
      type: object
      description: Editing card content clears both generated SVG illustrations. SVG editing is not supported.
      properties:
        questionImageIds:
          type: array
          maxItems: 80
          uniqueItems: true
          description: Ordered image IDs of this set; omitted preserves attachments on update, empty removes them.
          items:
            type: string
            format: uuid
        explanationImageIds:
          type: array
          maxItems: 80
          uniqueItems: true
          description: Ordered image IDs of this set; omitted preserves attachments on update, empty removes them.
          items:
            type: string
            format: uuid
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
          description: GFM + math; inline LaTeX $...$ and display LaTeX $$...$$.
        options:
          type: array
          items:
            type: string
          description: Choice options as GFM + math.
        table:
          $ref: '#/components/schemas/TableLayout'
        answer:
          $ref: '#/components/schemas/CardAnswer'
        explanation:
          type: string
          description: Explanation as GFM + math, including Markdown tables and LaTeX formulas.
        sourceQuote:
          type: string
          description: Verbatim quote from the notes; preserve all original characters without Markdown or LaTeX conversion.
        sourceRef:
          type: string
          description: "where the quote is from: «Лекция 3, стр. 2»"

    CardIssueReason:
      type: string
      description: What is wrong with a card, in the reader's opinion.
      enum:
        - answer
        - wording
        - not-in-notes
        - other

    ReportCardIssueRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/CardIssueReason'
        comment:
          type: string
          maxLength: 500
          description: >-
            What is wrong, in the reader's words; required with the reason
            other. Spaces around it are dropped before it is saved.

    CardIssueStatus:
      type: string
      description: >-
        open until the author answers; fixed when the card was edited after
        the complaint; kept when the author left the card as it is; deleted
        when the card is gone.
      enum:
        - open
        - fixed
        - kept
        - deleted

    AdminCardIssue:
      type: object
      required:
        - id
        - reason
        - status
        - kind
        - question
        - explanation
        - sourceQuote
        - reporter
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/CardIssueReason'
        status:
          $ref: '#/components/schemas/CardIssueStatus'
        setTitle:
          type: string
          description: Absent when the set is deleted
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
          description: GFM + math; inline LaTeX $...$ and display LaTeX $$...$$.
        answer:
          type: string
          description: The answer as stored with the card; absent for tables
        explanation:
          type: string
        sourceQuote:
          type: string
        comment:
          type: string
          description: What the reader wrote; absent when they only picked a reason
        reporter:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    SetIssue:
      type: object
      required:
        - cardId
        - reason
        - count
        - comments
        - lastReportedAt
      properties:
        cardId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/CardIssueReason'
        count:
          type: integer
          description: How many complaints with this reason
        comments:
          type: array
          description: What readers wrote with this reason, newest first
          items:
            type: string
        lastReportedAt:
          type: string
          format: date-time

    User:
      type: object
      required:
        - id
        - firstName
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
          description: The user's photo, when they have one and the viewer may see it
        anonymous:
          type: boolean
          description: >-
            The member has not let the set author see their name; firstName is
            then empty, and lastName and username are left out.

    CardSet:
      type: object
      required:
        - id
        - title
        - cardsTotal
        - cardsDue
        - author
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: "«Матанализ, лекция 3»"
        cardsTotal:
          type: integer
        cardsDue:
          type: integer
          description: how many are due for review
        author:
          $ref: '#/components/schemas/User'
        shareCode:
          type: string
          pattern: '\d{6}'
          example: '123456'
        warnings:
          type: array
          items:
            type: string
          description: Processing and recognition remarks, visible only to the set author
        userRank:
          type: integer
          description: User's rank place in the set rating (1-based)
          example: 1
        userPercentile:
          type: integer
          description: User's progress mapped from ELO (0-100%)
          example: 85

    JoinSetRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: '\d{6}'
          example: '123456'
          description: The 6-digit share code of the set

    RecallProbability:
      type: number
      format: double
      minimum: 0
      maximum: 1
    RetentionPoint:
      type: object
      required: [day, withReviews, withoutReviews]
      properties:
        day:
          type: number
          format: double
          minimum: 0
          maximum: 13
          description: Fractional days since calculatedAt; repeated coordinates show before and after a review.
        withReviews:
          $ref: '#/components/schemas/RecallProbability'
        withoutReviews:
          $ref: '#/components/schemas/RecallProbability'
    RetentionGroups:
      type: object
      required: [below70, from70To90, above90]
      properties:
        below70:
          type: integer
          minimum: 0
        from70To90:
          type: integer
          minimum: 0
          description: Both boundaries are inclusive.
        above90:
          type: integer
          minimum: 0
    SetRetention:
      type: object
      description: All facts count once, including unavailable and unlearned facts. Empty sets have zero probabilities; display them as unavailable.
      required: [calculatedAt, horizonDays, target, totalFacts, current, groups, points, withReviews, withoutReviews]
      properties:
        calculatedAt:
          type: string
          format: date-time
        horizonDays:
          type: integer
          enum: [13]
        target:
          $ref: '#/components/schemas/RecallProbability'
        totalFacts:
          type: integer
          minimum: 0
        current:
          $ref: '#/components/schemas/RecallProbability'
        groups:
          $ref: '#/components/schemas/RetentionGroups'
        points:
          type: array
          items:
            $ref: '#/components/schemas/RetentionPoint'
        withReviews:
          $ref: '#/components/schemas/RecallProbability'
        withoutReviews:
          $ref: '#/components/schemas/RecallProbability'

    SetPlanItem:
      type: object
      required:
        - factName
        - date
      properties:
        factName:
          type: string
        date:
          type: string
          format: date-time

    SetPlanResponse:
      type: array
      items:
        $ref: '#/components/schemas/SetPlanItem'

    LeaderboardEntry:
      type: object
      required:
        - user
        - rank
        - percentile
      properties:
        user:
          $ref: '#/components/schemas/User'
        rank:
          type: integer
          example: 1
        percentile:
          type: integer
          example: 85

    SetLeaderboardResponse:
      type: object
      required:
        - setId
        - items
      properties:
        setId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'

    SetMistakesResponse:
      type: object
      required:
        - setId
        - facts
        - students
      properties:
        setId:
          type: string
          format: uuid
        facts:
          description: >-
            Facts of the set, the ones most members made mistakes on first;
            facts nobody answered yet come last.
          type: array
          items:
            $ref: '#/components/schemas/FactMistakes'
        students:
          description: Current members, the author excluded, in the order they joined.
          type: array
          items:
            $ref: '#/components/schemas/StudentMistakes'

    FactMistakes:
      type: object
      required:
        - factId
        - factName
        - answers
        - mistakes
        - studentsAnswered
        - studentsMistaken
        - students
      properties:
        factId:
          type: string
          format: uuid
        factName:
          type: string
        answers:
          type: integer
        mistakes:
          type: integer
        studentsAnswered:
          description: Members who answered a card of the fact at least once.
          type: integer
        studentsMistaken:
          description: Members who made at least one mistake on the fact.
          type: integer
        students:
          description: Counts of the members who answered the fact.
          type: array
          items:
            $ref: '#/components/schemas/StudentFactMistakes'

    StudentFactMistakes:
      type: object
      required:
        - userId
        - answers
        - mistakes
      properties:
        userId:
          type: string
          format: uuid
        answers:
          type: integer
        mistakes:
          type: integer

    StudentMistakes:
      type: object
      required:
        - user
        - answers
        - mistakes
      properties:
        user:
          $ref: '#/components/schemas/User'
        answers:
          type: integer
        mistakes:
          type: integer

    TodayData:
      type: object
      required:
        - user
        - dueCount
        - estimatedMinutes
        - sets
      properties:
        user:
          $ref: '#/components/schemas/User'
        dueCount:
          type: integer
        estimatedMinutes:
          type: integer
        nextReviewAt:
          type: string
          format: date-time
          nullable: true
          description: Earliest scheduled review for the user, if any
        sets:
          type: array
          items:
            $ref: '#/components/schemas/CardSet'
        isAdmin:
          type: boolean
          description: The user sees every complaint, at GET /admin/issues

    AnswerQuestionRequest:
      type: object
      required:
        - answer
        - attemptId
      properties:
        attemptId:
          type: string
          format: uuid
          description: Unique submission ID, reused for retries and renewed for each new review
        answer:
          type: string
          description: >-
            input: the typed answer; choice: a JSON-encoded array of the
            selected option texts; boolean: true or false; table: a
            JSON-encoded array of TableItem, every term with the column it was
            put in; flip: true when the reader knew the answer, false when not

    AnswerQuestionResponse:
      type: object
      required:
        - isCorrect
        - method
      properties:
        isCorrect:
          type: boolean
        reason:
          type: string
          description: Why the answer counts or what it lacks, when a model judged it
        method:
          type: string
          enum:
            - local
            - model
            - fallback
          description: >-
            local: graded without a model (a typed answer matched up to form
            and typos, or surely wrong); model: judged by meaning; fallback:
            the model did not answer in time, nothing was recorded, ask again
        reveal:
          $ref: '#/components/schemas/CardReveal'
          description: Absent when the method is fallback
