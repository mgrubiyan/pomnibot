openapi: 3.0.3
info:
  title: Pomnibot API
  version: 1.0
  description: OpenAPI specification for Pomnibot
tags:
  - name: Sets
    description: Sets of cards
  - name: Cards
    description: Cards
  - name: Homescreen
    description: Homescreen

servers:
  - url: /api
    description: Base API prefix

paths:
  /profile:
    get:
      summary: Read the saved profile and verified platform
      operationId: GetProfile
      responses:
        '200':
          description: Saved profile (platform omitted for browser test user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Complete or edit a verified Telegram profile and clear bot dialogue
      operationId: PutProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      summary: Health check endpoint
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets:
    post:
      tags: [Sets]
      summary: CreateSet
      operationId: CreateSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}:
    get:
      tags:
        - Sets
      summary: Get a card set
      operationId: GetSet
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Card set retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Sets
      summary: Delete a card set
      operationId: DeleteSet
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set to delete
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card set deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Sets
      summary: Update set title
      operationId: UpdateSet
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSetRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card set updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/facts:
    post:
      tags:
        - Facts
      summary: Create a fact in a set
      operationId: CreateFact
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFactRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Fact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Facts
      summary: Get facts of a set
      operationId: GetFactsBySetID
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Facts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fact'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facts/{factId}:
    patch:
      tags:
        - Facts
      summary: Update fact name
      operationId: UpdateFact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Fact updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Facts
      summary: Delete a fact
      operationId: DeleteFact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Fact deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facts/{factId}/cards:
    post:
      tags:
        - Cards
      summary: Create a card in a fact
      operationId: CreateCardInFact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Card created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facts/{factId}/cards/order:
    put:
      tags:
        - Facts
      summary: Reorder cards in a fact
      operationId: ReorderCards
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCardsRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Cards reordered successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/cards:
    post:
      tags: [Cards]
      summary: CreateCard
      operationId: CreateCard
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Sets
      summary: Get cards
      operationId: GetCardsBySetID
      parameters:
        - name: setId
          in: path
          required: true
          description: Filter cards by set ID
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Cards retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/share:
    get:
      tags:
        - Sets
      summary: Get share code for a set
      operationId: GetSetShareCode
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Set share details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/plan:
    get:
      tags:
        - Sets
      summary: Get set's facts plan
      operationId: GetSetPlan
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Pairs fact - date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPlanResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/leaderboard:
    get:
      tags:
        - Sets
      summary: Get set leaderboard for author
      operationId: GetSetLeaderboard
      parameters:
        - name: setId
          in: path
          required: true
          description: The ID of the card set
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLeaderboardResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/join:
    post:
      tags:
        - Sets
      summary: Join a card set by code
      operationId: JoinSetByShareCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSetRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Card set joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /:
    get:
      tags:
        - Homescreen
      summary: Get today overview data
      operationId: GetToday
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Today data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayData'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feed:
    get:
      tags:
        - Homescreen
      summary: Get questions of current feed
      operationId: GetFeedQuestions
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Feed of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /results:
    post:
      tags:
        - Homescreen
      summary: Send set/feed results
      operationId: SendResults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendResultsRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Results was sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}:
    put:
      tags:
        - Cards
      summary: Update a card
      operationId: UpdateCard
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Card updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Cards
      summary: Delete a card
      operationId: DeleteCard
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card to delete
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/answer:
    post:
      tags:
        - Cards
      summary: Send answer's text for input kind of questions
      operationId: AnswerQuestion
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerQuestionRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerQuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/check:
    post:
      tags:
        - Cards
      summary: Check a typed answer by meaning without recording it
      description: >-
        The answer need not match word for word: form, word order and typos
        do not matter, and answers in other words are judged by a language
        model. Nothing is recorded: the feed sends results with SendResults.
      operationId: CheckAnswer
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAnswerRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/issue:
    post:
      tags:
        - Cards
      summary: Report what is wrong with a card
      description: >-
        Saves the complaint with a copy of the card as it was reported, so it
        outlives later edits and the card's deletion.
      operationId: ReportCardIssue
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCardIssueRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Card issue reported successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sets/{setId}/issues:
    get:
      tags:
        - Cards
      summary: Open complaints about the cards of the author's set
      description: >-
        Grouped by card and reason. A complaint is open until the card is
        edited after it or the author keeps the card as it is.
      operationId: GetSetIssues
      parameters:
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SetIssue'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/issue/resolve:
    post:
      tags:
        - Cards
      summary: Keep a card as it is and close its complaints
      operationId: ResolveCardIssues
      parameters:
        - name: cardId
          in: path
          required: true
          description: The ID of the card
          schema:
            type: string
            format: uuid
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Complaints closed
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/issues:
    get:
      tags:
        - Cards
      summary: Every complaint about cards, for admins
      description: >-
        All complaints across all sets, newest first, each with the copy of
        the card as it was reported and who reported it. Anyone but an admin
        gets an empty list.
      operationId: GetAdminIssues
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCardIssue'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    MiniAppAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: 'max <original MAX initData> or tma <original Telegram initData>; invalid credentials use test user 0'
  responses:
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden; code profile_required means a Telegram profile must be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProfileResponse:
      type: object
      required: [user, profileComplete]
      properties:
        user:
          $ref: '#/components/schemas/User'
        platform:
          type: string
          enum: [max, telegram]
        profileComplete:
          type: boolean
    ProfileRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code, including profile_required
        message:
          type: string

    TableItem:
      type: object
      description: A term of the table and the column it belongs to.
      required:
        - text
        - column
      properties:
        text:
          type: string
        column:
          type: string

    TableLayout:
      type: object
      description: "Sorting card: lay the terms out across the columns."
      required:
        - columns
        - items
      properties:
        columns:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TableItem'

    CardKind:
      type: string
      enum:
        - choice
        - flip
        - input
        - boolean
        - table

    CardAnswer:
      description: "
      choice - string[] (all correct option texts); legacy string/integer supported
      input - string
      boolean - boolean
      table - #/components/schemas/TableLayout
      "
      oneOf:
        - type: array                              # kind choice: all correct option texts
          minItems: 1
          uniqueItems: true
          items:
            type: string
        - type: integer                            # legacy choice: index in options
        - type: string                             # kind input
        - type: boolean                            # kind boolean
        - $ref: '#/components/schemas/TableLayout' # kind table

    Card:
      type: object
      required:
        - id
        - setId
        - factId
        - factName
        - kind
        - question
        - answer
        - explanation
        - sourceQuote
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        factId:
          type: string
          format: uuid
        factName:
          type: string
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
        options:
          type: array
          items:
            type: string
          description: choice only
        table:
          $ref: '#/components/schemas/TableLayout'
        answer:
          $ref: '#/components/schemas/CardAnswer'
        explanation:
          type: string
          description: 2-3 sentences
        sourceQuote:
          type: string
          description: quote from the notes
        sourceRef:
          type: string
          description: "where the quote is from: «Лекция 3, стр. 2»"
        step:
          type: integer

    Fact:
      type: object
      required:
        - id
        - setId
        - name
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        name:
          type: string

    CreateFactRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    UpdateFactRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    UpdateSetRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string

    ReorderCardsRequest:
      type: object
      required:
        - cardIds
      properties:
        cardIds:
          type: array
          items:
            type: string
            format: uuid

    CreateSetRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        card:
          $ref: '#/components/schemas/CreateCardRequest'

    CreateCardRequest:
      type: object
      required: [kind, question, answer]
      properties:
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
        answer:
          $ref: '#/components/schemas/CardAnswer'
        options:
          type: array
          items:
            type: string
        table:
          $ref: '#/components/schemas/TableLayout'
        explanation:
          type: string

    UpdateCardRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
        options:
          type: array
          items:
            type: string
          description: choice only
        table:
          $ref: '#/components/schemas/TableLayout'
        answer:
          $ref: '#/components/schemas/CardAnswer'
        explanation:
          type: string
          description: 2-3 sentences
        sourceQuote:
          type: string
          description: quote from the notes
        sourceRef:
          type: string
          description: "where the quote is from: «Лекция 3, стр. 2»"

    CardIssueReason:
      type: string
      description: What is wrong with a card, in the reader's opinion.
      enum:
        - answer
        - wording
        - not-in-notes
        - other

    ReportCardIssueRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/CardIssueReason'

    CardIssueStatus:
      type: string
      description: >-
        open until the author answers; fixed when the card was edited after
        the complaint; kept when the author left the card as it is; deleted
        when the card is gone.
      enum:
        - open
        - fixed
        - kept
        - deleted

    AdminCardIssue:
      type: object
      required:
        - id
        - reason
        - status
        - kind
        - question
        - explanation
        - sourceQuote
        - reporter
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/CardIssueReason'
        status:
          $ref: '#/components/schemas/CardIssueStatus'
        setTitle:
          type: string
          description: Absent when the set is deleted
        kind:
          $ref: '#/components/schemas/CardKind'
        question:
          type: string
        answer:
          type: string
          description: The answer as stored with the card; absent for tables
        explanation:
          type: string
        sourceQuote:
          type: string
        reporter:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    SetIssue:
      type: object
      required:
        - cardId
        - reason
        - count
        - lastReportedAt
      properties:
        cardId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/CardIssueReason'
        count:
          type: integer
          description: How many complaints with this reason
        lastReportedAt:
          type: string
          format: date-time

    User:
      type: object
      required:
        - id
        - firstName
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string

    CardSet:
      type: object
      required:
        - id
        - title
        - cardsTotal
        - cardsDue
        - author
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: "«Матанализ, лекция 3»"
        cardsTotal:
          type: integer
        cardsDue:
          type: integer
          description: how many are due for review
        author:
          $ref: '#/components/schemas/User'
        shareCode:
          type: string
          pattern: '\d{6}'
          example: '123456'
        userRank:
          type: integer
          description: User's rank place in the set rating (1-based)
          example: 1
        userPercentile:
          type: integer
          description: User's progress mapped from ELO (0-100%)
          example: 85

    JoinSetRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: '\d{6}'
          example: '123456'
          description: The 6-digit share code of the set

    SetPlanItem:
      type: object
      required:
        - factName
        - date
      properties:
        factName:
          type: string
        date:
          type: string
          format: date-time

    SetPlanResponse:
      type: array
      items:
        $ref: '#/components/schemas/SetPlanItem'

    LeaderboardEntry:
      type: object
      required:
        - user
        - rank
        - percentile
      properties:
        user:
          $ref: '#/components/schemas/User'
        rank:
          type: integer
          example: 1
        percentile:
          type: integer
          example: 85

    SetLeaderboardResponse:
      type: object
      required:
        - setId
        - items
      properties:
        setId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'

    TodayData:
      type: object
      required:
        - user
        - dueCount
        - estimatedMinutes
        - sets
      properties:
        user:
          $ref: '#/components/schemas/User'
        dueCount:
          type: integer
        estimatedMinutes:
          type: integer
        nextReviewAt:
          type: string
          format: date-time
          nullable: true
          description: Earliest scheduled review for the user, if any
        sets:
          type: array
          items:
            $ref: '#/components/schemas/CardSet'
        isAdmin:
          type: boolean
          description: The user sees every complaint, at GET /admin/issues

    Answer:
      type: object
      required:
        - cardId
        - correct
      properties:
        cardId:
          type: string
          format: uuid
        correct:
          type: boolean

    SendResultsRequest:
      type: array
      items:
        $ref: '#/components/schemas/Answer'

    AnswerQuestionRequest:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          description: Typed answer, or a JSON-encoded array of selected option texts for choice

    CheckAnswerRequest:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          description: Typed answer, or a JSON-encoded array of selected option texts for choice

    CheckAnswerResponse:
      type: object
      required:
        - isCorrect
        - method
      properties:
        isCorrect:
          type: boolean
        reason:
          type: string
          description: Why the answer counts or what it lacks, when a model judged it
        method:
          type: string
          enum:
            - local
            - model
            - fallback
          description: >-
            local: matched up to form and typos, or surely wrong; model: judged
            by meaning; fallback: the model did not answer in time, local verdict

    AnswerQuestionResponse:
      type: object
      required:
        - isCorrect
        - userAnswer
      properties:
        isCorrect:
          type: boolean
        userAnswer:
          type: string
