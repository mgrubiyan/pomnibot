services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-ghcr.io/mgrubiyan/pomnibot}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - DOMAIN=${DOMAIN:-pomnibot.steins.ru}
      - DATABASE_URL=postgres://${POSTGRES_USER:-pomnibot}:${POSTGRES_PASSWORD:-pomnibot}@postgres:5432/${POSTGRES_DB:-pomnibot}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomnibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomnibot}
      POSTGRES_DB: ${POSTGRES_DB:-pomnibot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pomnibot} -d ${POSTGRES_DB:-pomnibot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
