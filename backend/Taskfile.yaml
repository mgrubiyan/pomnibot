version: '3'

tasks:
  dev:
    desc: 'Запуск Go-сервера'
    cmds:
      - go run ./cmd/server

  lint:
    desc: 'Проверка кода бэкенда (golangci-lint)'
    cmds:
      - golangci-lint run --build-tags integration ./...

  test:
    desc: 'Запуск тестов бэкенда'
    cmds:
      - go test ./... {{.CLI_ARGS}}

  test:integration:
    desc: 'PostgreSQL integration tests (Docker required)'
    cmds:
      - go test -tags integration -count=1 ./internal/repository {{.CLI_ARGS}}

  test:race:
    desc: 'Run backend tests with the race detector'
    cmds:
      - go test -race ./... {{.CLI_ARGS}}

  bench:
    desc: 'Run backend microbenchmarks'
    cmds:
      - go test -run '^$' -bench . -benchmem ./... {{.CLI_ARGS}}

  build:
    desc: 'Сборка бинарника бэкенда'
    cmds:
      - go build -o server ./cmd/server

  sqlc:
    desc: 'Генерация Go-кода по SQL-запросам (sqlc)'
    aliases:
      - gen
      - gen:sql
    sources:
      - sqlc.yaml
      - internal/repository/migrations/*.sql
      - internal/repository/migrations/**/*.sql
      - internal/repository/queries/*.sql
      - internal/repository/queries/**/*.sql
    generates:
      - internal/repository/db/*.go
      - internal/repository/db/**/*.go
    cmds:
      - sqlc generate
