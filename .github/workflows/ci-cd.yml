name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'contracts/data-api/validator-requirements.txt'

      - name: Install DATA-API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 'contracts/data-api/validator-requirements.txt'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate DATA-API.yaml
        run: |
          task gen:data-api

      - name: Check for drift (is committed DATA-API up-to-date?)
        run: |
          git diff --exit-code contracts/data-api/DATA-API.yaml \
          || (echo "DATA-API.yaml outdated! Run generate_data_api.py and commit result." && exit 1)

      - name: Run DATA-API Validator
        run: |
          python contracts/data-api/validate_data_api.py contracts/data-api/DATA-API.yaml \
          --openapi $GITHUB_WORKSPACE/contracts/openapi.yaml \
          --schema $GITHUB_WORKSPACE/contracts/data-api/DATA-API.schema.json

      - name: Install contracts dependencies
        working-directory: contracts
        run: bun install --frozen-lockfile

      - name: Install sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Verify generated contracts
        run: |
          task gen --force
          git diff --exit-code backend/contracts miniapp/contracts

      - name: Install frontend dependencies
        working-directory: miniapp
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: miniapp
        run: bun run lint

      - name: Build frontend
        working-directory: miniapp
        run: bun run build

      - name: Vet Go backend
        working-directory: backend
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL -o /tmp/golangci-lint.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          sudo mv /tmp/golangci-lint-2.13.2-linux-amd64/golangci-lint /usr/local/bin/

      - name: Lint Go backend
        working-directory: backend
        run: golangci-lint run ./...

      - name: Test Go backend
        working-directory: backend
        run: go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pomnibot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and Push Docker Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env file from secrets
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          PORT: ${{ secrets.PORT }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          IMAGE_TAG: ${{ secrets.IMAGE_TAG }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_CLIENT_ID: ${{ secrets.GIGACHAT_CLIENT_ID }}
          GIGACHAT_CLIENT_SECRET: ${{ secrets.GIGACHAT_CLIENT_SECRET }}
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          GIGACHAT_MODEL: ${{ secrets.GIGACHAT_MODEL }}
          GIGACHAT_FALLBACK_MODEL: ${{ secrets.GIGACHAT_FALLBACK_MODEL }}
          GIGACHAT_BASE_URL: ${{ secrets.GIGACHAT_BASE_URL }}
          GIGACHAT_AUTH_URL: ${{ secrets.GIGACHAT_AUTH_URL }}
          GIGACHAT_MAX_TOKENS: ${{ secrets.GIGACHAT_MAX_TOKENS }}
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_OCR_MODEL: ${{ secrets.YC_OCR_MODEL }}
          APP_URL: ${{ secrets.APP_URL }}
          MAX_API_URL: ${{ secrets.MAX_API_URL }}
          MAX_INSECURE_SKIP_VERIFY: ${{ secrets.MAX_INSECURE_SKIP_VERIFY }}
        run: |
          touch .env
          chmod 600 .env
          SECRETS=(
            DOMAIN
            PORT
            BOT_TOKEN
            DOCKER_IMAGE
            IMAGE_TAG
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_DB
            POSTGRES_PORT
            DATABASE_URL
            GIGACHAT_AUTH_KEY
            GIGACHAT_CLIENT_ID
            GIGACHAT_CLIENT_SECRET
            GIGACHAT_SCOPE
            GIGACHAT_MODEL
            GIGACHAT_FALLBACK_MODEL
            GIGACHAT_BASE_URL
            GIGACHAT_AUTH_URL
            GIGACHAT_MAX_TOKENS
            YC_API_KEY
            YC_FOLDER_ID
            YC_OCR_MODEL
            APP_URL
            MAX_API_URL
            MAX_INSECURE_SKIP_VERIFY
          )
          POPULATED=()
          for key in "${SECRETS[@]}"; do
            val="${!key}"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$key" "$val" >> .env
              POPULATED+=("$key")
            fi
          done
          if [ ${#POPULATED[@]} -gt 0 ]; then
            echo "Populated .env with secrets: ${POPULATED[*]}"
          else
            echo "No secrets provided; .env created empty."
          fi

      - name: Copy Compose and .env files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER || 'deployer' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          source: 'docker-compose.yaml,docker-compose.prod.yaml,.env'
          target: ${{ secrets.DEPLOY_PATH || '/home/deployer/pomnibot' }}

      - name: Pull and restart containers via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER || 'deployer' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/deployer/pomnibot' }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Set restrictive permissions on .env if copied
            [ -f .env ] && chmod 600 .env

            # Login to GHCR to pull image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # Pull latest image and recreate containers using production overlay
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --remove-orphans

            # Clean up dangling images
            docker image prune -f
