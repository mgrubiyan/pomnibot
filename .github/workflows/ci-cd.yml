name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'contracts/data-api/validator-requirements.txt'

      - name: Install DATA-API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 'contracts/data-api/validator-requirements.txt'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate DATA-API.yaml
        run: |
          task gen:data-api

      - name: Check for drift (is committed DATA-API up-to-date?)
        run: |
          git diff --exit-code contracts/data-api/DATA-API.yaml \
          || (echo "DATA-API.yaml outdated! Run generate_data_api.py and commit result." && exit 1)

      - name: Run DATA-API Validator
        run: |
          python contracts/data-api/validate_data_api.py contracts/data-api/DATA-API.yaml \
          --openapi $GITHUB_WORKSPACE/contracts/openapi.yaml \
          --schema $GITHUB_WORKSPACE/contracts/data-api/DATA-API.schema.json

      - name: Install contracts dependencies
        working-directory: contracts
        run: bun install --frozen-lockfile

#      - name: Install sqlc
#        run: |
#          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
#
      - name: Verify generated contracts
        run: |
          task gen --force
          git diff --exit-code backend/contracts miniapp/contracts

      - name: Install frontend dependencies
        working-directory: miniapp
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: miniapp
        run: bun run lint

      - name: Build frontend
        working-directory: miniapp
        run: bun run build

      - name: Vet Go backend
        working-directory: backend
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL -o /tmp/golangci-lint.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          sudo mv /tmp/golangci-lint-2.13.2-linux-amd64/golangci-lint /usr/local/bin/

      - name: Lint Go backend
        working-directory: backend
        run: golangci-lint run ./...

      - name: Test Go backend
        working-directory: backend
        run: go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pomnibot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and Push Docker Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER || 'deployer' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          source: 'docker-compose.yaml,docker-compose.prod.yaml'
          target: ${{ secrets.DEPLOY_PATH || '/home/deployer/pomnibot' }}

      - name: Pull and restart containers via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER || 'deployer' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/deployer/pomnibot' }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Login to GHCR to pull image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # Pull latest image and recreate containers using production overlay
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --remove-orphans

            # Clean up dangling images
            docker image prune -f
